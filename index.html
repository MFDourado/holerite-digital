<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holerite Digital · Blincast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --graphite:#202123; --graphite-deep:#141519; --gold:#FAC11C; --gold-deep:#E0A90A;
    --paper:#F6F6F4; --paper-raised:#FFFFFF; --ink:#1F2127; --ink-soft:#6B6E76;
    --line:#E4E3DE; --line-soft:#EEEDE8;
    --good:#2B8A5A; --good-bg:#E8F5EE; --bad:#C2483A; --bad-bg:#FBEAE7;
    --warn:#8A6A00; --warn-bg:#FBF1D2;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:0 0 80px;}
  .num{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 0;}
  #app{max-width:420px;margin:20px auto 0;}
  #app.wide{max-width:960px;margin-top:0;}
  h1{font-size:23px;font-weight:800;margin:0 0 6px;text-align:center;letter-spacing:-.2px;}
  h2{font-size:16px;font-weight:700;margin:0 0 4px;letter-spacing:-.1px;}
  p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 26px;text-align:center;}
  p.hint{color:var(--ink-soft);font-size:13.5px;margin:0 0 16px;line-height:1.55;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;}
  input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;padding:12px;border-radius:8px;margin-bottom:14px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(250,193,28,.25);}
  textarea{min-height:140px;resize:vertical;line-height:1.5;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .row > div{flex:1;min-width:200px;}
  button{width:100%;font-family:'Inter',sans-serif;font-weight:700;font-size:14px;border:none;background:var(--gold);color:var(--graphite);padding:13px 18px;border-radius:8px;cursor:pointer;transition:background .15s;}
  button:hover{background:var(--gold-deep);}
  button.ghost{background:transparent;color:var(--graphite);border:1.5px solid var(--line);}
  button.ghost:hover{background:var(--line-soft);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button.auto{width:auto;}
  .switch{text-align:center;margin-top:16px;font-size:12.5px;color:var(--ink-soft);}
  .switch a{color:var(--graphite);font-weight:600;cursor:pointer;text-decoration:underline;}
  .error{color:var(--bad);font-size:13px;margin:-6px 0 14px;}
  .ok{color:var(--good);font-size:13px;margin:8px 0;}
  .muted{color:var(--ink-soft);font-size:12.5px;}

  .brandbar{background:var(--graphite);padding:18px 20px;display:flex;justify-content:center;}
  .brandbar img{height:34px;display:block;}
  .verstag{text-align:center;font-size:10.5px;color:var(--ink-soft);padding:6px 0 0;font-family:'IBM Plex Mono',monospace;}

  .topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--graphite);padding-bottom:14px;margin-bottom:26px;}
  .topbar .who{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .topbar button{width:auto;padding:8px 14px;}
  select.period{font-size:13px;font-weight:600;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;margin-bottom:18px;}

  .slip{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:32px 36px;box-shadow:0 1px 3px rgba(31,33,39,.06);}
  .slip-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px;}
  .slip-head .co{font-size:17px;font-weight:800;}
  .slip-head .period{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-align:right;}
  .slip-who .name{font-size:18px;font-weight:700;margin-bottom:20px;}
  .cols{display:flex;gap:28px;}
  .cols>div{flex:1;}
  .col-title{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px;}
  .line-item{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
  .v.pos{color:var(--good);font-family:'IBM Plex Mono',monospace;}
  .v.neg{color:var(--bad);font-family:'IBM Plex Mono',monospace;}
  .subtotal{display:flex;justify-content:space-between;font-size:13.5px;padding-top:8px;margin-top:6px;border-top:1px solid var(--line-soft);font-weight:700;}
  .liquido{margin-top:24px;padding:18px 22px;background:var(--graphite);color:var(--gold);display:flex;justify-content:space-between;align-items:center;border-radius:10px;}
  .liquido span:first-child{font-size:12px;font-weight:700;letter-spacing:.4px;color:#fff;}
  .liquido .amt{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;}

  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin-bottom:20px;box-shadow:0 1px 3px rgba(31,33,39,.05);}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:13px;}
  th{font-size:10.5px;font-weight:700;letter-spacing:.3px;color:var(--ink-soft);text-transform:uppercase;}
  select{font-size:13px;border:1.5px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;}
  .badge.p{background:var(--good-bg);color:var(--good);}
  .badge.ai{background:var(--warn-bg);color:var(--warn);}
  .badge.i{background:var(--line-soft);color:var(--ink-soft);}
  input[type=file]{font-size:12.5px;}

  @media print{ .no-print{display:none !important;} body{padding:0;} .slip{border:none;padding:0;} }
  @media (max-width:600px){ .cols{flex-direction:column;} .slip{padding:22px 20px;} }
</style>
</head>

/* ======= CONFIGURAR ANTES DE DISTRIBUIR ======= */
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyl1nm-qU-cj2ucxrtH40q4gZTXcuRrodig8xcANkQXInazRv6dKhjJv7J8zBsjqHyQSQ/exec';
const COMPANY_NAME = 'Blincast Media';

function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(window.__pdfLibPromise) return window.__pdfLibPromise;
  window.__pdfLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve();
    };
    s.onerror = () => reject(new Error('Não consegui carregar a biblioteca de leitura de PDF. Confira sua internet (ou se algum firewall/bloqueador está travando cdnjs.cloudflare.com) e tente de novo.'));
    document.head.appendChild(s);
  });
  return window.__pdfLibPromise;
}

const app = document.getElementById('app');
window.addEventListener('error', function(ev){
  if(app && !app.innerHTML.trim()){
    app.className = '';
    app.innerHTML = `<div class="error" style="text-align:left;white-space:pre-wrap;">Erro ao carregar a página:\n${(ev.message||'desconhecido').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}\n\nManda um print dessa mensagem pro suporte.</div>`;
  }
});
const verspanEl = document.getElementById('verspan');
if(verspanEl) verspanEl.textContent = APP_VERSION;
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function fmtBRL(n){ return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function parseBRL(str){
  if(typeof str==='number') return str;
  if(!str) return 0;
  let s=String(str).replace(/[^\d,.\-]/g,'').trim();
  if(s.indexOf(',')>-1 && s.indexOf('.')>-1) s=s.replace(/\./g,'').replace(',', '.');
  else if(s.indexOf(',')>-1) s=s.replace(',', '.');
  const v=parseFloat(s); return isNaN(v)?0:v;
}

async function callApi(action, payload){
  const resp = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, ...payload})
  });
  return resp.json();
}

let mode = 'login'; // login | signup | admin_gate | admin
let session = null;

/* ================= LOGIN / SIGNUP (colaborador) ================= */
function renderAuth(errorMsg){
  app.className = '';
  app.innerHTML = `
    <h1>${escapeHtml(COMPANY_NAME)}</h1>
    <p class="sub">${mode==='login' ? 'entre com sua matrícula e senha' : 'primeiro acesso — crie sua senha'}</p>
    <label>Matrícula</label>
    <input type="text" id="matricula" inputmode="numeric" placeholder="Ex: 78">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="mínimo 6 caracteres">
    ${errorMsg ? `<div class="error">${escapeHtml(errorMsg)}</div>` : ''}
    <button id="btnGo">${mode==='login' ? 'Entrar' : 'Criar senha e entrar'}</button>
    <div class="switch">
      ${mode==='login'
        ? 'primeiro acesso? <a id="toSignup">criar senha</a>'
        : 'já tem senha? <a id="toLogin">entrar</a>'}
      <br><a id="toAdmin" style="margin-top:6px;display:inline-block;">área do gestor</a>
    </div>
  `;
  document.getElementById('btnGo').onclick = mode==='login' ? doLogin : doSignup;
  const s = document.getElementById('toSignup'); if(s) s.onclick = () => { mode='signup'; renderAuth(); };
  const l = document.getElementById('toLogin'); if(l) l.onclick = () => { mode='login'; renderAuth(); };
  document.getElementById('toAdmin').onclick = () => { mode='admin_gate'; renderAdminGate(); };
}

async function doLogin(){
  const matricula = document.getElementById('matricula').value.trim();
  const senha = document.getElementById('senha').value;
  if(!matricula || senha.length<6){ renderAuth('Confira a matrícula e a senha.'); return; }
  document.getElementById('btnGo').disabled = true;
  let res;
  try{ res = await callApi('login', {matricula, senha}); }
  catch(e){ renderAuth('Não consegui falar com o servidor. Confira sua internet e tente de novo.'); return; }
  if(!res.ok){ renderAuth(res.error); return; }
  session = res;
  renderPortal(session.periods[0] ? session.periods[0].id : null);
}

async function doSignup(){
  const matricula = document.getElementById('matricula').value.trim();
  const senha = document.getElementById('senha').value;
  if(!matricula || senha.length<6){ renderAuth('Confira a matrícula e a senha (mínimo 6 caracteres).'); return; }
  document.getElementById('btnGo').disabled = true;
  let res;
  try{ res = await callApi('signup', {matricula, senha}); }
  catch(e){ renderAuth('Não consegui falar com o servidor. Confira sua internet e tente de novo.'); return; }
  if(!res.ok){ renderAuth(res.error); return; }
  session = res;
  renderPortal(session.periods[0] ? session.periods[0].id : null);
}

/* ================= PORTAL (colaborador logado) ================= */
function renderPortal(selectedPeriodId){
  app.className = 'wide';
  const opts = session.periods.map(p => `<option value="${p.id}" ${p.id===selectedPeriodId?'selected':''}>${escapeHtml(p.label)}</option>`).join('');
  const lines = session.lines.filter(l => l.period_id === selectedPeriodId);
  const proventos = lines.filter(l=>l.tipo==='provento');
  const descontos = lines.filter(l=>l.tipo==='desconto');
  const totalP = proventos.reduce((a,l)=>a+Number(l.valor),0);
  const totalD = descontos.reduce((a,l)=>a+Number(l.valor),0);
  const periodLabel = (session.periods.find(p=>p.id===selectedPeriodId)||{}).label || '';

  app.innerHTML = `
    <div style="max-width:860px;margin:0 auto;">
    <div class="topbar no-print">
      <div class="who">${escapeHtml(session.nome)}</div>
      <button class="ghost auto" id="btnLogout">Sair</button>
    </div>
    ${session.periods.length ? `<select class="period no-print" id="periodSelect">${opts}</select>` : '<p class="sub" style="text-align:left">Nenhum contracheque disponível ainda.</p>'}
    ${session.periods.length ? `
    <div class="slip">
      <div class="slip-head">
        <div class="co">${escapeHtml(COMPANY_NAME)}</div>
        <div class="period">RECIBO DE PAGAMENTO<br>${escapeHtml(periodLabel)}</div>
      </div>
      <div class="slip-who"><div class="name">${escapeHtml(session.nome)}</div></div>
      <div class="cols">
        <div>
          <div class="col-title">PROVENTOS</div>
          ${proventos.map(l=>`<div class="line-item"><span>${escapeHtml(l.descricao)}</span><span class="v pos num">${fmtBRL(Number(l.valor))}</span></div>`).join('') || '<div class="line-item"><span>—</span><span></span></div>'}
          <div class="subtotal"><span>Total de proventos</span><span class="num">${fmtBRL(totalP)}</span></div>
        </div>
        <div>
          <div class="col-title">DESCONTOS</div>
          ${descontos.map(l=>`<div class="line-item"><span>${escapeHtml(l.descricao)}</span><span class="v neg num">${fmtBRL(Number(l.valor))}</span></div>`).join('') || '<div class="line-item"><span>—</span><span></span></div>'}
          <div class="subtotal"><span>Total de descontos</span><span class="num">${fmtBRL(totalD)}</span></div>
        </div>
      </div>
      <div class="liquido"><span>LÍQUIDO A RECEBER</span><span class="amt">R$ ${fmtBRL(totalP-totalD)}</span></div>
    </div>
    <div class="no-print" style="margin-top:18px;"><button class="auto" id="btnPrint">Imprimir / salvar como PDF</button></div>
    ` : ''}
    </div>
  `;
  document.getElementById('btnLogout').onclick = () => { session=null; mode='login'; renderAuth(); };
  const sel = document.getElementById('periodSelect');
  if(sel) sel.onchange = e => renderPortal(e.target.value);
  const pb = document.getElementById('btnPrint');
  if(pb) pb.onclick = () => window.print();
}

/* ================= ÁREA DO GESTOR ================= */
let adminSecret = localStorage.getItem('hd_admin_secret') || '';

function renderAdminGate(errorMsg){
  app.className = '';
  app.innerHTML = `

    <p class="sub">informe seu segredo de acesso</p>

    <input type="password" id="secretInput" value="${escapeHtml(adminSecret)}">

const PROVENTO_TERMS = ['salario base','salario','vencimento','comissao','comissoes','bonus','hora extra','horas extras',
  'adicional noturno','adicional','gratificacao','ajuda de custo','ppr','participacao nos lucros','ferias','13o salario',
  'decimo terceiro','decimo 3','premio','insalubridade','periculosidade','dsr','abono','reembolso','beneficio','remuneracao variavel'];
const DESCONTO_TERMS = ['inss','irrf','ir ','imposto de renda','vale transporte','vale-transporte','vt ','vale refeicao',
  'vale-refeicao','desconto','falta','atraso','pensao alimenticia','contribuicao sindical','emprestimo','coparticipacao',
  'plano de saude','plano saude','adiantamento salarial','adiantamento'];
const IGNORE_TERMS = ['nome','colaborador','funcionario','cpf','matricula','cargo','departamento','centro de custo',
  'admissao','fgts','liquido','total','base de calculo','base calculo'];

function dictClassify(header){
  const h = normalize(header);
  if(IGNORE_TERMS.some(t=>h.includes(t))){
    if(h.includes('matricula')||h.includes('codigo')) return 'matricula';
    if(h.includes('nome')||h.includes('colaborador')||h.includes('funcionario')) return 'nome';
    return 'ignorar';
  }
  if(DESCONTO_TERMS.some(t=>h.includes(t))) return 'desconto';
  if(PROVENTO_TERMS.some(t=>h.includes(t))) return 'provento';
  return null;
}

function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(lines.length<2) return null;
  const delim = lines[0].split('\t').length > lines[0].split(',').length ? '\t' : ',';
  const headers = lines[0].split(delim).map(h=>h.trim());
  const rows = lines.slice(1).map(line=>{
    const cells = line.split(delim); const obj={};
    headers.forEach((h,i)=>obj[h]=(cells[i]||'').trim());
    return obj;
  });
  return {headers, rows};
}

/* ---------- leitura de PDF (holerite Blincast: Código/Descrição/Referência/Vencimentos/Descontos) ---------- */
async function pdfToPayrollRows(file){
  await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let allLines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const items = content.items.map(it => ({ text: it.str, x: it.transform[4], y: Math.round(it.transform[5]) })).filter(it => it.text.trim().length>0);
    const byY = {};
    items.forEach(it => { const key = Math.round(it.y/3)*3; (byY[key]=byY[key]||[]).push(it); });
    const ys = Object.keys(byY).map(Number).sort((a,b)=>b-a);
    ys.forEach(y => allLines.push(byY[y].sort((a,b)=>a.x-b.x)));
  }

  const rowText = row => row.map(it=>it.text).join(' ');
  const normRow = row => normalize(rowText(row));
  function snap(row, anchors){
    const cells = anchors.map(()=>[]);
    row.forEach(it=>{
      let best=0, bestDist=Infinity;
      anchors.forEach((ax,i)=>{ const d=Math.abs(ax-it.x); if(d<bestDist){bestDist=d; best=i;} });
      cells[best].push(it.text);
    });
    return cells.map(c=>c.join(' ').trim());
  }
  // pra tabela de itens, colunas ficam bem coladas (Código termina em ~x20, Descrição começa
  // em ~x38) — "mais perto do ponto" confunde a 1ª palavra da descrição com o código. Em vez
  // disso, usa faixas fixas de posição x, calibradas nesse layout de holerite da Blincast.
  function snapByBoundary(row, upperBounds){
    const cells = upperBounds.map(()=>[]);
    row.forEach(it=>{
      let col = upperBounds.findIndex(b => it.x < b);
      if(col === -1) col = upperBounds.length - 1;
      cells[col].push(it.text);
    });
    return cells.map(c=>c.join(' ').trim());
  }
  function moneyVal(s){
    if(!s) return 0;
    if(/^\d{1,2}:\d{2}$/.test(s.trim())) return 0; // é hora (coluna Referência), não valor
    if(!/\d/.test(s)) return 0;
    return parseBRL(s);
  }
  function limparDescricao(s){ return s.replace(/\.\s*$/,'').replace(/\s+/g,' ').trim(); }

  const ANCHORS_FUNC = [19, 51, 377, 431, 490];       // código | nome | cbo | departamento | filial
  const ITEM_BOUNDS = [30, 280, 355, 440, Infinity];  // código | descrição | referência | vencimentos | descontos

  const funcionariosBrutos = [];
  let periodo = '';
  let atual = null;
  let coletandoItens = false;

  for(let i=0; i<allLines.length; i++){
    const row = allLines[i];
    const nrow = normRow(row);

    if(!periodo){
      const m = rowText(row).match(/([A-Za-zÀ-úà-ú]+)\s+de\s+(\d{4})/);
      if(m) periodo = `${m[1]}/${m[2]}`;
    }

    if(nrow.includes('nome') && nrow.includes('funcionario') && nrow.includes('cbo') && allLines[i+1]){
      const cells = snap(allLines[i+1], ANCHORS_FUNC);
      const matricula = (cells[0]||'').trim();
      const nome = (cells[1]||'').trim();
      if(matricula && nome){
        if(atual && atual.itens.length) funcionariosBrutos.push(atual);
        atual = { matricula, nome, itens: [] };
        coletandoItens = false;
      }
      continue;
    }

    if(nrow.includes('codigo') && nrow.includes('descricao') && nrow.includes('vencimentos') && nrow.includes('descontos')){
      coletandoItens = true;
      continue;
    }

    if(coletandoItens){
      if(nrow.includes('total') && (nrow.includes('vencimentos') || nrow.includes('descontos'))){
        coletandoItens = false;
        continue;
      }
      const cells = snapByBoundary(row, ITEM_BOUNDS);
      const descricao = limparDescricao(cells[1]||'');
      const vencimento = moneyVal(cells[3]);
      const desconto = moneyVal(cells[4]);
      if(atual && descricao){
        if(vencimento) atual.itens.push({descricao, tipo:'provento', valor:vencimento});
        if(desconto) atual.itens.push({descricao, tipo:'desconto', valor:desconto});
      }
    }
  }
  if(atual && atual.itens.length) funcionariosBrutos.push(atual);

  // remove duplicatas (vias repetidas do mesmo holerite) — mantém só a 1ª ocorrência por matrícula
  const vistos = new Set();
  const funcionarios = funcionariosBrutos.filter(f=>{
    if(vistos.has(f.matricula)) return false;
    vistos.add(f.matricula);
    return true;
  });

  return { periodo, funcionarios };
}

          msg.innerHTML = `<div class="ok">Planilha lida (aba "${escapeHtml(wb.SheetNames[0])}"). Confira antes de processar.</div>`;

        } else {
          msg.innerHTML = '<div class="error">Formato não reconhecido. Use PDF, .xlsx, .xls ou .csv.</div>';
        }
      }
    }catch(err){
      msg.innerHTML = `<div class="error">Não consegui ler o arquivo: ${escapeHtml(err.message||err)}</div>`;
    }
  };

  document.getElementById('btnParse').onclick = () => {
    const text = document.getElementById('csvInput').value;
    const msg = document.getElementById('parseMsg');
    const parsed = parseCsv(text);
    if(!parsed){ msg.innerHTML = '<div class="error">Não consegui reconhecer linhas/colunas nos dados.</div>'; return; }
    draft.headers = parsed.headers;

      draft.mapping[h] = { tipo: guess || 'revisar', source: guess ? 'dict' : 'none' };
    });
    msg.innerHTML = `<div class="ok">${parsed.rows.length} linha(s) lida(s).</div>`;
    renderReview();
  };
}

  const opts = data.periods.map(p => `<option value="${p.id}" ${p.id===selectedPeriodId?'selected':''}>${escapeHtml(p.label)}</option>`).join('');
  const lines = data.lines.filter(l => l.period_id === selectedPeriodId);
  const proventos = lines.filter(l=>l.tipo==='provento');
  const descontos = lines.filter(l=>l.tipo==='desconto');
  const totalP = proventos.reduce((a,l)=>a+Number(l.valor),0);
  const totalD = descontos.reduce((a,l)=>a+Number(l.valor),0);
  const periodLabel = (data.periods.find(p=>p.id===selectedPeriodId)||{}).label || '';

  area.innerHTML = data.periods.length ? `
    <select class="period" id="adminPeriodSelect">${opts}</select>
    <div class="slip">
      <div class="slip-head">
        <div class="co">${escapeHtml(COMPANY_NAME)}</div>
        <div class="period">RECIBO DE PAGAMENTO<br>${escapeHtml(periodLabel)}</div>
      </div>
      <div class="slip-who"><div class="name">${escapeHtml(data.nome)}</div></div>
      <div class="cols">
        <div>
          <div class="col-title">PROVENTOS</div>
          ${proventos.map(l=>`<div class="line-item"><span>${escapeHtml(l.descricao)}</span><span class="v pos num">${fmtBRL(Number(l.valor))}</span></div>`).join('') || '<div class="line-item"><span>—</span><span></span></div>'}
          <div class="subtotal"><span>Total de proventos</span><span class="num">${fmtBRL(totalP)}</span></div>
        </div>
        <div>
          <div class="col-title">DESCONTOS</div>
          ${descontos.map(l=>`<div class="line-item"><span>${escapeHtml(l.descricao)}</span><span class="v neg num">${fmtBRL(Number(l.valor))}</span></div>`).join('') || '<div class="line-item"><span>—</span><span></span></div>'}
          <div class="subtotal"><span>Total de descontos</span><span class="num">${fmtBRL(totalD)}</span></div>
        </div>
      </div>
      <div class="liquido"><span>LÍQUIDO A RECEBER</span><span class="amt">R$ ${fmtBRL(totalP-totalD)}</span></div>
    </div>
  ` : '<p class="sub" style="text-align:left">Nenhum contracheque disponível ainda pra esse colaborador.</p>';

  const sel = document.getElementById('adminPeriodSelect');
  if(sel) sel.onchange = e => renderAdminSlip(data, e.target.value);
}

let pdfDraft = null;
let pdfIndex = 0;

function renderPdfReview(result){
  document.getElementById('cardReviewPdf').style.display = 'block';
  pdfDraft = result;
  pdfIndex = 0;
  document.getElementById('pdfPeriodo').value = result.periodo || '';
  renderPdfEmployeesArea();
}

function renderPdfEmployeesArea(){
  const area = document.getElementById('pdfEmployeesArea');
  const total = pdfDraft.funcionarios.length;
  if(pdfIndex >= total) pdfIndex = total - 1;
  if(pdfIndex < 0) pdfIndex = 0;
  const f = pdfDraft.funcionarios[pdfIndex];
  const fi = pdfIndex;

  area.innerHTML = `
    ${total > 1 ? `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;">
        <button class="ghost auto" id="btnPdfPrev" ${pdfIndex===0?'disabled':''}>&larr; Anterior</button>
        <span class="muted">${pdfIndex+1} de ${total}</span>
        <button class="ghost auto" id="btnPdfNext" ${pdfIndex===total-1?'disabled':''}>Próximo &rarr;</button>
      </div>
    ` : ''}
    <div style="border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:14px;">
      <div class="row" style="margin-bottom:10px;">
        <div><label>Nome</label><input type="text" data-fi="${fi}" class="pdfNome" value="${escapeHtml(f.nome)}"></div>
        <div><label>Matrícula</label><input type="text" data-fi="${fi}" class="pdfMatricula" value="${escapeHtml(f.matricula)}"></div>
      </div>
      <table>
        <tr><th>Descrição</th><th>Tipo</th><th>Valor</th></tr>
        ${f.itens.map((it, ii) => `
          <tr>
            <td>${escapeHtml(it.descricao)}</td>
            <td><select data-fi="${fi}" data-ii="${ii}" class="pdfTipo">
              <option value="provento" ${it.tipo==='provento'?'selected':''}>+ Provento</option>
              <option value="desconto" ${it.tipo==='desconto'?'selected':''}>&minus; Desconto</option>
            </select></td>
            <td class="num">${fmtBRL(it.valor)}</td>
          </tr>
        `).join('')}
      </table>
      <div style="margin-top:14px;"><button class="ghost auto" id="btnPdfRemove" style="color:var(--bad);border-color:var(--bad);">Remover este colaborador da lista</button></div>
    </div>
  `;

  document.querySelectorAll('.pdfNome').forEach(inp => inp.oninput = e => { pdfDraft.funcionarios[e.target.getAttribute('data-fi')].nome = e.target.value; });
  document.querySelectorAll('.pdfMatricula').forEach(inp => inp.oninput = e => { pdfDraft.funcionarios[e.target.getAttribute('data-fi')].matricula = e.target.value.trim(); });
  document.querySelectorAll('.pdfTipo').forEach(sel => sel.onchange = e => { pdfDraft.funcionarios[e.target.getAttribute('data-fi')].itens[e.target.getAttribute('data-ii')].tipo = e.target.value; });
  const btnPrev = document.getElementById('btnPdfPrev');
  const btnNext = document.getElementById('btnPdfNext');
  if(btnPrev) btnPrev.onclick = () => { pdfIndex--; renderPdfEmployeesArea(); };
  if(btnNext) btnNext.onclick = () => { pdfIndex++; renderPdfEmployeesArea(); };
  document.getElementById('btnPdfRemove').onclick = () => {
    const removido = pdfDraft.funcionarios.splice(fi, 1)[0];
    const msg = document.getElementById('parseMsg');
    if(msg) msg.innerHTML = `<div class="ok">"${escapeHtml(removido.nome)}" removido da lista — os outros ${pdfDraft.funcionarios.length} continuam prontos pra enviar. Suba o PDF dele separado depois de corrigir.</div>`;
    if(pdfDraft.funcionarios.length === 0){
      document.getElementById('cardReviewPdf').style.display = 'none';
      return;
    }
    renderPdfEmployeesArea();
  };
}

function renderReview(){
  document.getElementById('cardReview').style.display = 'block';
  const tbody = document.getElementById('colTableBody');
  tbody.innerHTML = draft.headers.map(h => {
    const sample = escapeHtml((draft.rawRows[0]||{})[h] || '');
    const m = draft.mapping[h];
    const badge = m.source==='dict' ? '<span class="badge p">⚡ dicionário</span>' : m.source==='ai' ? '<span class="badge ai">🤖 IA</span>' : m.tipo==='revisar' ? '<span class="badge i">revisar</span>' : '';
    return `<tr>
      <td><strong>${escapeHtml(h)}</strong>${badge}</td>
      <td class="num">${sample}</td>
      <td>
        <select data-col="${escapeHtml(h)}" class="colType">
          <option value="ignorar" ${m.tipo==='ignorar'?'selected':''}>Ignorar</option>
          <option value="nome" ${m.tipo==='nome'?'selected':''}>Nome</option>
          <option value="matricula" ${m.tipo==='matricula'?'selected':''}>Matrícula</option>
          <option value="provento" ${m.tipo==='provento'?'selected':''}>+ Provento</option>
          <option value="desconto" ${m.tipo==='desconto'?'selected':''}>&minus; Desconto</option>
          <option value="revisar" ${m.tipo==='revisar'?'selected':''}>? Revisar</option>
        </select>
      </td>
    </tr>`;
  }).join('');
  document.querySelectorAll('.colType').forEach(sel => {
    sel.onchange = e => { draft.mapping[e.target.getAttribute('data-col')].tipo = e.target.value; draft.mapping[e.target.getAttribute('data-col')].source='manual'; updateSummary(); };
  });
  updateSummary();
}

function updateSummary(){
  const pending = Object.values(draft.mapping).filter(m=>m.tipo==='revisar').length;
  const hasNome = Object.values(draft.mapping).some(m=>m.tipo==='nome');
  const hasMatricula = Object.values(draft.mapping).some(m=>m.tipo==='matricula');
  document.getElementById('summaryLine').textContent = `${pending} coluna(s) pendente(s) de revisão. Nome: ${hasNome?'ok':'faltando'} · Matrícula: ${hasMatricula?'ok':'faltando'}`;
  document.getElementById('btnPush').disabled = pending>0 || !hasNome || !hasMatricula || !draft.period;
  document.getElementById('btnPush').onclick = async () => {
    const msg = document.getElementById('pushMsg');
    msg.innerHTML = '<div class="muted">enviando...</div>';
    try{
      const nomeCol = Object.keys(draft.mapping).find(h=>draft.mapping[h].tipo==='nome');
      const matriculaCol = Object.keys(draft.mapping).find(h=>draft.mapping[h].tipo==='matricula');
      const valueCols = Object.keys(draft.mapping).filter(h=>['provento','desconto'].includes(draft.mapping[h].tipo));
      const rows = draft.rawRows.map(r => ({
        matricula: (r[matriculaCol]||'').trim(), nome: r[nomeCol],
        items: valueCols.map(h => ({ descricao: h, tipo: draft.mapping[h].tipo, valor: parseBRL(r[h]) })).filter(i => i.valor !== 0)
      })).filter(r => r.matricula && r.nome);
      const res = await callApi('admin_push', { secret: adminSecret, period_label: draft.period, rows });
      if(!res.ok) throw new Error(res.error);
      msg.innerHTML = `<div class="ok">Período "${escapeHtml(draft.period)}" enviado — ${res.count} colaborador(es) processado(s).</div>`;
    }catch(e){ msg.innerHTML = `<div class="error">Erro ao enviar: ${escapeHtml(e.message||e)}</div>`; }
  };
}

try{
  renderAuth();
}catch(bootErr){
  app.className = '';
  app.innerHTML = `<div class="error" style="text-align:left;white-space:pre-wrap;">Erro ao carregar a página:\n${escapeHtml(String(bootErr && bootErr.message || bootErr))}\n\nManda um print dessa mensagem pro suporte.</div>`;
}
</script>
